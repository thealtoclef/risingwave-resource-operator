repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
      args: [--unsafe]
    - id: check-added-large-files

  - repo: https://github.com/arkbriar/pre-commit-golang
    rev: v0.5.0
    hooks:
      - id: go-fmt
      # go-vet skipped: covered by golangci-lint
      - id: go-imports
        exclude: ^.*zz_generated.*.go$
      - id: go-cyclo
        args: [-over=80]
      - id: validate-toml
      - id: no-go-testing
      - id: golangci-lint
      # go-unit-tests skipped: requires envtest setup
      - id: go-build
      - id: go-mod-tidy
